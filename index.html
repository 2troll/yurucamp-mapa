<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuru Camp△ Japón</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="campings.js?v=4"></script>
<script src="vocabulario.js?v=4"></script>
<script src="voces.js?v=9"></script>
<script src="audios.js?v=9"></script>
<script src="anime.js?v=8"></script>
<script src="lugares.js?v=8"></script>
<style>
  :root {
    --borde: rgba(255,255,255,.38);
    --texto: #fff;
    --suave: rgba(255,255,255,.7);
    --tenue: rgba(255,255,255,.12);
    --sombra: 0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(255,255,255,.08);
    --T1: #ff9f0a; --T2: #bf5af2; --T3: #0a84ff; --Pel: #30d158;
    --rojo: #ff453a; --oro: #ffd60a;
    --radio: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0b1a24; color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Hiragino Sans", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .jp { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  button { font-family: inherit; color: inherit; }
  #mapa { position: fixed; inset: 0; }

  .cristal {
    background: linear-gradient(135deg, rgba(40,46,58,.55), rgba(18,22,30,.38));
    backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--borde); box-shadow: var(--sombra);
  }
  .fino::-webkit-scrollbar { width: 0; height: 0; }

  /* ---------- Dock inferior ---------- */
  #dock { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 1500;
    display: flex; gap: 4px; padding: 6px; border-radius: 26px; }
  #dock button { border: 0; background: transparent; border-radius: 20px; padding: 8px 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--suave);
    transition: background .25s, color .25s, transform .15s; }
  #dock button span { font-size: 22px; line-height: 1; }
  #dock button:hover { transform: translateY(-2px); }
  #dock button.activo { background: rgba(255,255,255,.22); color: #fff; }

  /* ---------- Panel de campings ---------- */
  #panel { position: fixed; top: 16px; left: 16px; bottom: 100px; width: 360px; z-index: 1000;
    border-radius: var(--radio); display: flex; flex-direction: column; overflow: hidden; transition: opacity .3s, transform .3s; }
  #panel header { padding: 20px 20px 10px; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .sub { color: var(--suave); font-size: 13px; margin-top: 4px; }
  #buscar { width: 100%; margin-top: 12px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--borde);
    background: rgba(255,255,255,.12); color: #fff; font: 14px inherit; font-family: inherit; outline: none; }
  #buscar::placeholder { color: var(--suave); }
  #filtros { padding: 0 20px 6px; display: flex; flex-direction: column; gap: 8px; max-height: 38%; overflow-y: auto; }
  .grupo { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .grupo::-webkit-scrollbar { height: 0; }
  .chip { flex: none; border: 1px solid var(--borde); background: rgba(255,255,255,.1); font-size: 12px; font-weight: 600;
    padding: 7px 11px; border-radius: 999px; cursor: pointer; transition: background .2s, transform .15s; white-space: nowrap; }
  .chip:hover { transform: scale(1.04); }
  .chip.activo { background: rgba(255,255,255,.88); color: #111; text-shadow: none; }
  .fila-orden { display: flex; justify-content: space-between; align-items: center; padding: 6px 20px; font-size: 12px; color: var(--suave); }
  #lista { overflow-y: auto; padding: 4px 10px 14px; flex: 1; }
  .item { display: flex; gap: 12px; align-items: center; padding: 9px; border-radius: 18px; cursor: pointer; transition: background .2s; position: relative; }
  .item:hover, .item.sel { background: rgba(255,255,255,.18); }
  .item img, .item .sinfoto { width: 66px; height: 46px; border-radius: 11px; object-fit: cover; flex: none; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .sinfoto { background: rgba(255,255,255,.15); display: grid; place-items: center; font-size: 20px; }
  .item b { font-size: 14px; font-weight: 650; display: block; }
  .item small { color: var(--suave); font-size: 12px; }
  .item .sello-mini { position: absolute; left: 58px; top: 4px; font-size: 15px; }
  .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .vacia { padding: 30px 12px; text-align: center; color: var(--suave); font-size: 14px; }

  /* ---------- Ficha del camping ---------- */
  #ficha { position: fixed; right: 16px; top: 16px; bottom: 100px; width: min(520px, calc(100vw - 408px)); z-index: 1000;
    border-radius: var(--radio); overflow-y: auto; transform: translateX(calc(100% + 32px)); transition: transform .5s cubic-bezier(.2,.9,.3,1.1); }
  #ficha.abierta { transform: none; }
  .portada { position: relative; height: 240px; border-radius: var(--radio) var(--radio) 0 0; overflow: hidden; }
  .portada img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
  .portada::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(10,14,20,.85)); pointer-events: none; }
  .portada .titulo { position: absolute; left: 20px; right: 20px; bottom: 14px; z-index: 1; }
  .portada h2 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  .portada .sinfoto { width: 100%; height: 100%; font-size: 64px; border-radius: 0; }
  /* Pegajoso para que siga a mano al bajar por la ficha */
  .cerrar { position: sticky; top: 12px; display: block; margin: 12px 12px -48px auto; z-index: 5; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--borde); background: rgba(0,0,0,.35); backdrop-filter: blur(10px); font-size: 15px; cursor: pointer; }
  .cuerpo { padding: 16px 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  ruby { ruby-position: over; } rt { font-size: 11px; color: var(--suave); }
  .nombre-ja { font-size: 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hablar { border: 1px solid var(--borde); background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .hablar:hover { background: rgba(255,255,255,.28); }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; }
  .etq { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--tenue); border: 1px solid rgba(255,255,255,.2); }
  .bloque { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 18px; padding: 12px 14px; }
  .bloque h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin-bottom: 4px; }
  .bloque p { font-size: 14.5px; line-height: 1.45; }
  .palabra-sitio { display: flex; align-items: center; gap: 14px; }
  .palabra-sitio .kanji { font-size: 44px; font-weight: 700; line-height: 1; }
  #galeria { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; }
  #galeria img { height: 120px; border-radius: 14px; scroll-snap-align: start; cursor: zoom-in; flex: none; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .boton { text-align: center; text-decoration: none; color: #fff; font-weight: 650; font-size: 14px; cursor: pointer;
    padding: 12px; border-radius: 16px; border: 1px solid var(--borde); background: rgba(255,255,255,.16); }
  .boton:hover { background: rgba(255,255,255,.3); }
  .boton.grande { grid-column: 1 / -1; font-size: 15px; }
  .boton.hecho { background: rgba(255,69,58,.35); border-color: rgba(255,120,110,.7); }

  /* ---------- Hojas (Palabras, Quiz, Mochila, Pasaporte) ---------- */
  .hoja { position: fixed; z-index: 1200; left: 50%; top: 16px; bottom: 100px; width: min(880px, calc(100vw - 32px));
    transform: translate(-50%, 30px) scale(.97); opacity: 0; pointer-events: none; border-radius: var(--radio);
    display: flex; flex-direction: column; overflow: hidden; transition: opacity .35s, transform .45s cubic-bezier(.2,.9,.3,1.1); }
  .hoja.abierta { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  .hoja > header { padding: 22px 24px 12px; display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
  .hoja .contenido { flex: 1; overflow-y: auto; padding: 4px 24px 24px; }
  .progreso { height: 8px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; }
  .progreso i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--T1), var(--rojo)); transition: width .5s; }

  /* Palabras */
  .pestañas { display: flex; gap: 6px; overflow-x: auto; padding: 0 24px 12px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .tarjeta { position: relative; border-radius: 20px; padding: 14px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16);
    cursor: pointer; min-height: 132px; display: flex; flex-direction: column; gap: 4px; transition: transform .2s, background .2s; perspective: 800px; }
  .tarjeta:hover { transform: translateY(-3px); background: rgba(255,255,255,.14); }
  .tarjeta .emo { font-size: 22px; }
  .tarjeta .escritura { font-size: 24px; font-weight: 700; line-height: 1.2; word-break: keep-all; }
  .tarjeta .lectura { font-size: 13px; color: var(--suave); }
  .tarjeta .es { font-size: 14px; font-weight: 600; margin-top: auto; }
  .tarjeta.oculta .es, .tarjeta.oculta .romaji { filter: blur(7px); }
  .tarjeta .romaji { font-size: 12px; color: var(--suave); font-style: italic; }
  .tarjeta .estrella { position: absolute; top: 10px; right: 10px; border: 0; background: none; font-size: 18px; cursor: pointer; opacity: .5; }
  .tarjeta .estrella.si { opacity: 1; }
  .tarjeta .altavoz { position: absolute; top: 10px; right: 38px; border: 0; background: none; font-size: 17px; cursor: pointer; }
  .del-dia { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; margin-bottom: 14px;
    background: linear-gradient(120deg, rgba(255,159,10,.28), rgba(191,90,242,.22)); border: 1px solid rgba(255,255,255,.25); }
  .del-dia .kanji { font-size: 38px; font-weight: 800; }

  /* Quiz */
  .modos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .modo { border-radius: 22px; padding: 18px; cursor: pointer; border: 1px solid rgba(255,255,255,.22); text-align: left;
    background: linear-gradient(140deg, rgba(255,255,255,.16), rgba(255,255,255,.04)); transition: transform .2s; }
  .modo:hover { transform: translateY(-3px) scale(1.01); }
  .modo .emo { font-size: 34px; }
  .modo b { display: block; font-size: 17px; margin-top: 8px; }
  .modo small { color: var(--suave); font-size: 13px; }
  .pregunta { text-align: center; padding: 10px 0 18px; }
  .pregunta .grande { font-size: 52px; font-weight: 800; line-height: 1.15; }
  .pregunta img { max-width: 100%; max-height: 300px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opcion { padding: 16px; border-radius: 18px; border: 1px solid var(--borde); background: rgba(255,255,255,.12); cursor: pointer;
    font-size: 16px; font-weight: 650; transition: background .2s, transform .15s; }
  .opcion:hover { transform: scale(1.02); background: rgba(255,255,255,.2); }
  .opcion.bien { background: rgba(48,209,88,.55); border-color: #30d158; }
  .opcion.mal { background: rgba(255,69,58,.5); border-color: var(--rojo); }
  .marcador { display: flex; gap: 14px; font-size: 14px; color: var(--suave); }
  .marcador b { color: #fff; }
  .explica { text-align: center; margin-top: 14px; font-size: 14px; color: var(--suave); min-height: 20px; }

  /* Mochila */
  .seccion-mochila h3 { font-size: 15px; margin: 16px 0 8px; }
  .check { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; cursor: pointer; transition: background .2s; }
  .check:hover { background: rgba(255,255,255,.08); }
  .check .caja { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--borde); display: grid; place-items: center; flex: none; font-size: 14px; }
  .check.si .caja { background: #30d158; border-color: #30d158; }
  .check.si .txt { opacity: .55; text-decoration: line-through; }
  .check .jpn { font-size: 16px; font-weight: 700; }
  .check small { color: var(--suave); }

  /* Pasaporte */
  .rango { font-size: 15px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: rgba(255,214,10,.2); border: 1px solid rgba(255,214,10,.6); }
  .sellos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .sello { border-radius: 20px; padding: 14px; text-align: center; background: rgba(255,255,255,.07); border: 1px dashed rgba(255,255,255,.3); cursor: pointer; transition: transform .2s; }
  .sello:hover { transform: scale(1.03); }
  .hanko { width: 86px; height: 86px; margin: 4px auto 10px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800;
    border: 4px solid rgba(255,255,255,.25); color: rgba(255,255,255,.25); text-shadow: none; }
  .sello.si { border-style: solid; border-color: rgba(255,69,58,.5); background: rgba(255,69,58,.1); }
  .sello.si .hanko { border-color: var(--rojo); color: var(--rojo); background: rgba(255,255,255,.9); transform: rotate(-12deg); box-shadow: 0 4px 14px rgba(255,69,58,.4); }
  .sello b { font-size: 13px; display: block; }
  .sello small { font-size: 11px; color: var(--suave); }

  /* ---------- Otros ---------- */
  .marca { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 19px;
    border: 2px solid rgba(255,255,255,.95); box-shadow: 0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.6); transition: transform .25s; position: relative; }
  .marca.sel { transform: scale(1.35); }
  .marca .visto { position: absolute; right: -6px; top: -6px; font-size: 14px; }
  .yo { width: 18px; height: 18px; border-radius: 50%; background: #0a84ff; border: 3px solid #fff; box-shadow: 0 0 0 8px rgba(10,132,255,.25); }
  .leaflet-tooltip.cristal-tt { background: rgba(20,20,30,.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--borde); color: #fff; border-radius: 12px; font-family: inherit; font-weight: 600; box-shadow: none; }
  .leaflet-tooltip.cristal-tt::before { display: none; }
  .leaflet-control-zoom { display: none; }
  .leaflet-control-attribution { background: rgba(0,0,0,.35) !important; color: #ddd !important; border-radius: 8px 0 0 0; }
  .leaflet-control-attribution a { color: #fff !important; }
  #visor { position: fixed; inset: 0; z-index: 3000; display: none; place-items: center; background: rgba(0,0,0,.6);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); cursor: zoom-out; }
  #visor.abierto { display: grid; }
  #visor img { max-width: 94vw; max-height: 90vh; border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #aviso { position: fixed; top: 20px; left: 50%; transform: translate(-50%, -140%); z-index: 3000; padding: 12px 18px; border-radius: 18px;
    font-weight: 650; transition: transform .45s cubic-bezier(.2,.9,.3,1.2); }
  #aviso.visible { transform: translate(-50%, 0); }
  .confeti { position: fixed; z-index: 3500; pointer-events: none; font-size: 26px; animation: caer 1.4s ease-out forwards; }
  @keyframes caer { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }

  /* ---------- Asa y filtros plegables (se usan en el móvil) ---------- */
  .asa { display: none; }
  #ver-filtros { display: none; }

  /* ---------- Bocadillo: quién está hablando ---------- */
  #bocadillo { position: fixed; left: 50%; bottom: calc(var(--dock-h, 86px) + 14px); z-index: 2500; display: flex; gap: 12px; align-items: center;
    width: max-content; max-width: min(520px, calc(100vw - 24px)); padding: 10px 16px 10px 10px; border-radius: 22px;
    transform: translate(-50%, 20px) scale(.9); opacity: 0; pointer-events: none; transition: opacity .3s, transform .4s cubic-bezier(.2,.9,.3,1.3); }
  #bocadillo.visible { transform: translate(-50%, 0) scale(1); opacity: 1; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 24px;
    border: 2px solid rgba(255,255,255,.9); box-shadow: 0 4px 12px rgba(0,0,0,.35); position: relative; }
  #bocadillo.hablando .avatar { animation: latido .5s ease-in-out infinite alternate; }
  @keyframes latido { to { transform: scale(1.08) rotate(-4deg); } }
  #bocadillo .quien { font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .05em; }
  #bocadillo .dice { font-size: 17px; font-weight: 700; line-height: 1.3; }
  #bocadillo .trad { font-size: 13px; color: var(--suave); }

  /* ---------- Personajes ---------- */
  .motor { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 18px; margin-bottom: 14px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); font-size: 13.5px; line-height: 1.45; }
  .motor b { font-size: 14px; }
  .luz { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #ff9f0a; box-shadow: 0 0 10px #ff9f0a; }
  .luz.si { background: #30d158; box-shadow: 0 0 10px #30d158; }
  .pjs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .pj { border-radius: 22px; padding: 14px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); display: flex; flex-direction: column; gap: 10px; }
  .pj.guia { border-color: rgba(255,214,10,.8); box-shadow: 0 0 0 1px rgba(255,214,10,.5) inset; }
  .pj-cab { display: flex; gap: 12px; align-items: center; }
  .pj-cab b { font-size: 17px; display: block; }
  .pj p { font-size: 13.5px; line-height: 1.4; color: rgba(255,255,255,.88); }
  .pj .botones { display: flex; gap: 6px; flex-wrap: wrap; }
  .deslizador { display: grid; grid-template-columns: 70px 1fr 34px; align-items: center; gap: 8px; font-size: 12px; color: var(--suave); }
  .deslizador input { width: 100%; accent-color: #ffd60a; }
  .selector-voz { width: 100%; min-width: 0; background: rgba(255,255,255,.12); color: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 7px; font: inherit; font-size: 12.5px; }
  .selector-voz option { color: #111; }
  .clips { display: grid; gap: 6px; }
  .clip { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .clip span { flex: 1; color: var(--suave); }
  .clip button, .clip label { border: 1px solid var(--borde); background: rgba(255,255,255,.12); border-radius: 999px; min-width: 34px; height: 34px; padding: 0 10px;
    cursor: pointer; font-size: 14px; display: grid; place-items: center; }
  .clip .si { background: rgba(48,209,88,.4); border-color: #30d158; }
  .clip .grabando { background: var(--rojo); animation: latido .6s infinite alternate; }
  details.plegable summary { cursor: pointer; font-size: 12.5px; color: var(--suave); padding: 4px 0; list-style: none; }
  details.plegable summary::-webkit-details-marker { display: none; }
  details.plegable[open] summary { margin-bottom: 8px; }
  .creditos { margin-top: 18px; font-size: 11.5px; color: var(--suave); line-height: 1.5; }

  /* Hoguera */

  /* ---------- Lugares del anime en el mapa ---------- */
  .pin { width: 30px; height: 30px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); display: grid; place-items: center;
    border: 2px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.45); transition: transform .2s; }
  .pin span { transform: rotate(45deg); font-size: 15px; line-height: 1; }
  .pin.visto::after { content: '💮'; position: absolute; transform: rotate(45deg); right: -12px; top: -10px; font-size: 12px; }
  .pin:hover { transform: rotate(-45deg) scale(1.2); }
  .fuji-marca { font-size: 46px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); animation: flotar 3s ease-in-out infinite; text-align: center; line-height: 1; }
  .fuji-marca small { display: block; font-size: 12px; font-weight: 800; color: #fff; background: rgba(0,0,0,.45); border-radius: 99px; padding: 2px 8px; margin-top: -4px; }
  @keyframes flotar { 50% { transform: translateY(-5px); } }
  .leaflet-popup-content-wrapper { background: linear-gradient(135deg, rgba(40,46,58,.88), rgba(18,22,30,.85)); color: #fff; border-radius: 22px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--borde); box-shadow: var(--sombra); }
  .leaflet-popup-tip { background: rgba(30,34,44,.9); }
  .leaflet-popup-content { margin: 0; width: 280px !important; }

  /* =====================================================================

  :root { --vidrio: rgba(26,30,40,.52); --vidrio-fuerte: rgba(22,26,36,.72); --linea: rgba(255,255,255,.22);

<script>

/* ================= Datos fijos ================= */
// En el Mac se usan las capturas guardadas en fotos/; en la web pública, las del mapa de fans

const COLORES = { T1: 'var(--T1)', T2: 'var(--T2)', T3: 'var(--T3)', 'Película': 'var(--Pel)' };
const PERSONAJES = {

  aoi:       { emoji: '🍳', nombre: 'Aoi',        ja: '犬山あおい' },
  ena:       { emoji: '🐶', nombre: 'Ena',        ja: '斉藤恵那' },
  ayano:     { emoji: '🏍️', nombre: 'Ayano',      ja: '土岐綾乃' },

};
const PAISAJES = { lago: '🏞️ Lago', mar: '🌊 Mar', 'montaña': '⛰️ Montaña', 'río': '💧 Río', bosque: '🌲 Bosque', meseta: '🌾 Meseta', pradera: '🌿 Pradera' };
const ESTACIONES = { 'otoño': '🍁 Otoño', invierno: '❄️ Invierno', primavera: '🌸 Primavera', verano: '☀️ Verano' };

  [6, '🛵 Campista solitaria como Rin'], [10, '🗻 Cazadora de Fujis'], [15, '🎖️ Maestra ゆるキャン'], [CAMPINGS.length, '👑 Leyenda de Yamanashi']];
const MOCHILA = [

  { voz: 'aoi', titulo: '🔥 Fuego y cocina', cosas: [['焚き火台', 'brasero'], ['薪', 'leña'], ['着火剤', 'pastilla de encendido'], ['バーナー', 'hornillo'],
      ['ガス缶', 'cartucho de gas'], ['鍋', 'olla'], ['カップ麺', 'fideos instantáneos, por si acaso (como Rin)'], ['割り箸', 'palillos']] },

];
// Cada tema de vocabulario lo dice la chica que más pega con él
const VOZ_CATEGORIA = { equipo: 'chiaki', fuego: 'aoi', camping: 'rin', naturaleza: 'ena', carretera: 'sakura', gps: 'ayano', sitios: 'nadeshiko', frases: 'toba', anime: 'nadeshiko' };
const vozPalabra = cat => Voz.ajustes.soloGuia ? Voz.guia : (VOZ_CATEGORIA[cat] || Voz.guia);
const TODAS_PALABRAS = VOCABULARIO.flatMap(c => c.palabras.map(p => ({ es: p[3], w: p[0], kana: p[1], romaji: p[2], emoji: p[4], cat: c.id })));

/* ================= Memoria local (solo comodidad; si falla, la app sigue) ================= */
const guardado = (() => {
  const leer = (k, def) => { try { return JSON.parse(localStorage.getItem('yc_' + k)) ?? def; } catch { return def; } };
  const escribir = (k, v) => { try { localStorage.setItem('yc_' + k, JSON.stringify(v)); } catch {} };
  return { leer, escribir };
})();
const visitados = new Set(guardado.leer('visitados', []));
const aprendidas = new Set(guardado.leer('aprendidas', []));
const mochila = new Set(guardado.leer('mochila', []));

/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const baraja = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Todo lo que suena en japonés lo dice un personaje; si no se indica cuál, la guía elegida en «Voces»
function hablar(texto, quien) { Voz.decir(texto, quien); }
let temporizadorBocadillo;
Voz.alHablar = ({ texto, quien, traduccion }) => {
  const p = PERSONAJES[quien] || VOCES_EXTRA[quien], f = VOZ_DE(quien), b = $('#bocadillo');
  // En los diálogos el propio chat ya enseña quién habla
  if (!p || ($('#hoja-palabras').classList.contains('abierta') && seccionPalabras === 'dialogos')) return;
  b.innerHTML = `<div class="avatar" style="background:${f.color}">${p.emoji}</div>
    <div><div class="quien">${esc(p.nombre)} · <span class="jp">${esc(p.ja)}</span></div><div class="dice jp">${esc(texto)}</div>${traduccion ? `<div class="trad">${esc(traduccion)}</div>` : ''}</div>`;
  b.classList.add('visible', 'hablando');
  clearTimeout(temporizadorBocadillo);
  // Visible más o menos lo que dura la frase, y un poco más para leer la traducción
  temporizadorBocadillo = setTimeout(() => b.classList.remove('visible', 'hablando'), 2600 + texto.length * 160);
};
let temporizadorAviso;
function avisar(txt) { const a = $('#aviso'); a.textContent = txt; a.classList.add('visible'); clearTimeout(temporizadorAviso); temporizadorAviso = setTimeout(() => a.classList.remove('visible'), 2600); }
function confeti(emojis = ['🎉', '⭐', '🏕️', '🔥', '🗻', '🌸']) {
  for (let i = 0; i < 26; i++) {
    const e = document.createElement('div'); e.className = 'confeti'; e.textContent = emojis[i % emojis.length];
    e.style.left = innerWidth / 2 + 'px'; e.style.top = innerHeight / 2 + 'px';
    e.style.setProperty('--dx', (Math.random() - .5) * innerWidth * .9 + 'px');
    e.style.setProperty('--dy', (Math.random() - .7) * innerHeight * .8 + 'px');
    e.style.setProperty('--rot', (Math.random() - .5) * 720 + 'deg');
    document.body.appendChild(e); setTimeout(() => e.remove(), 1500);
  }
}
function km(a, b) {
  const R = 6371, r = x => x * Math.PI / 180, dLat = r(b[0] - a[0]), dLng = r(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function ruby(ja, kana) {
  // Furigana sobre todo el nombre; los nombres mezclan kanji y katakana y no se pueden alinear carácter a carácter sin diccionario
  return /[一-龯]/.test(ja) ? `<ruby class="jp">${esc(ja)}<rt>${esc(kana)}</rt></ruby>` : `<span class="jp">${esc(ja)}</span>`;
}

/* ================= Mapa ================= */
let seleccionado = null;
const mapa = L.map('mapa', { zoomControl: false }).setView([35.4, 138.4], 8);
const pie = 'Capturas: ©あfろ・芳文社／野外活動委員会';
const satelite = L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imágenes © Esri · ' + pie }),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }),
]);
const topo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Mapa © Esri · ' + pie });
const noche = L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Mapa © Esri · ' + pie }),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }),
]);
// El estilo «anime» es el topográfico pintado con filtros CSS en tonos pastel
const ESTILOS = [['satelite', '🛰️ Satélite', satelite], ['anime', '🎨 Anime', topo], ['topo', '🗺️ Topo', topo], ['noche', '🌙 Noche', noche]];
let estilo = guardado.leer('estilo', 'anime');
function ponerEstilo(clave) {
  const nuevo = ESTILOS.find(e => e[0] === clave) || ESTILOS[1];
  ESTILOS.forEach(e => { if (e[2] !== nuevo[2]) mapa.removeLayer(e[2]); });
  nuevo[2].addTo(mapa);
  document.body.classList.remove('estilo-anime', 'estilo-noche');
  if (clave === 'anime' || clave === 'noche') document.body.classList.add('estilo-' + clave);
  estilo = nuevo[0]; guardado.escribir('estilo', estilo);
  pintarEstilos();
}
const MUESTRA_ESTILO = { satelite: 'linear-gradient(135deg,#1f3b2a,#4a6b3a 50%,#2a4a6b)', anime: 'linear-gradient(135deg,#ffe6c7,#c9f0d3 50%,#bfe1ff)',
  topo: 'linear-gradient(135deg,#efe9d8,#cfe3c1 50%,#b8d8e8)', noche: 'radial-gradient(circle at 30% 30%,#fff 1px,transparent 2px),linear-gradient(135deg,#1a1f3a,#2d1b44)' };
function pintarEstilos() {
  $('#estilos').innerHTML = ESTILOS.map(([k, t]) => `<button class="estilo ${estilo === k ? 'activo' : ''}" data-estilo="${k}"><i style="background:${MUESTRA_ESTILO[k]}"></i>${t.split(' ')[1]}</button>`).join('');
  $('#estilos').querySelectorAll('[data-estilo]').forEach(b => b.onclick = () => ponerEstilo(b.dataset.estilo));
}
ponerEstilo(estilo);
const abrirCapas = abrir => { $('#capas').classList.toggle('abierto', abrir); $('#capa').classList.toggle('activo', abrir); };
$('#capa').onclick = () => abrirCapas(!$('#capas').classList.contains('abierto'));
$('#capas-cerrar').onclick = () => abrirCapas(false);
mapa.on('click', () => abrirCapas(false));
$('#yo').onclick = () => $('#cerca').onclick();

/* ----- El Fuji, siempre a la vista ----- */
L.marker([35.3606, 138.7274], { icon: L.divIcon({ className: '', iconSize: [80, 70], iconAnchor: [40, 50], html: '<div class="fuji-marca">🗻<small class="jp">富士山</small></div>' }), zIndexOffset: -100 })
  .addTo(mapa).on('click', () => { Voz.decir('富士山だ〜！きれい〜！', 'nadeshiko', { traduccion: '¡Es el Fuji! ¡Qué bonito! (ふじさん, 3.776 m)' }); });

/* ----- Hojas que caen según la estación del año ----- */
const PARTICULAS = { primavera: ['🌸', '🌸', '🌼'], verano: ['✨', '🌿', '✨'], 'otoño': ['🍁', '🍂', '🍁'], invierno: ['❄️', '❄️', '⛄'] };
const estacionHoy = (() => { const m = new Date().getMonth() + 1; return m >= 3 && m <= 5 ? 'primavera' : m <= 8 && m >= 6 ? 'verano' : m >= 9 && m <= 11 ? 'otoño' : 'invierno'; })();
let conParticulas = guardado.leer('particulas', true);
function pintarParticulas() {
  let caja = $('#particulas');
  if (!caja) { caja = document.createElement('div'); caja.id = 'particulas'; $('#mapa').appendChild(caja); }
  caja.innerHTML = '';

  $('#estacion').classList.toggle('activo', conParticulas);
  if (!conParticulas) return;
  for (let n = 0; n < (esMovil() ? 9 : 16); n++) {

$('#estacion').onclick = () => { conParticulas = !conParticulas; guardado.escribir('particulas', conParticulas); pintarParticulas(); };

const marcadores = CAMPINGS.map((c, i) => L.marker([c.lat, c.lng], { icon: iconoDe(i) })

  .on('click', () => abrirFicha(i)));
function iconoDe(i) {

    html: `<div class="marca ${i === seleccionado ? 'sel' : ''}" style="background:${COLORES[c.temporada]}">⛺${visitados.has(i) ? '<span class="visto">💮</span>' : ''}</div>` });

/* ================= Lugares del anime: casas, instituto, bancos, onsen… ================= */
const COLOR_LUGAR = { casa: '#ff8fb1', escuela: '#ffd166', banco: '#c79bff', estacion: '#5e9bff', onsen: '#ff7a59', templo: '#e5484d',

const iconoLugar = i => { const l = LUGARES[i];
  return L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28],

const marcasLugar = LUGARES.map((l, i) => L.marker([l.lat, l.lng], { icon: iconoLugar(i), zIndexOffset: -50 })

mapa.on('popupopen', () => document.body.classList.add('con-globo')).on('popupclose', () => document.body.classList.remove('con-globo'));
function globoLugar(i) {
  const l = LUGARES[i], cat = CATEGORIAS_LUGAR[l.c], [pk, pkana, pes] = cat.palabra, voz = cat.voz;
  const div = document.createElement('div'); div.className = 'globo-lugar';
  div.innerHTML = `${l.f ? `<img src="${l.f}" alt="Escena del anime: ${esc(l.n)}" loading="lazy">` : ''}

      <h3 class="jp">${esc(l.n)}</h3>
      ${l.nota && !/^\s*$/.test(l.nota) ? `<p class="sub" style="font-size:12.5px">${esc(l.nota)}</p>` : ''}
      <div class="palabra"><b class="jp">${esc(pk)}</b><div style="flex:1"><b class="jp" style="font-size:14px">${esc(pkana)}</b> — ${esc(pes)}<br>
        <small class="sub">te lo dice ${PERSONAJES[voz].emoji} ${PERSONAJES[voz].nombre}</small></div><button class="hablar" data-p="1">🔊</button></div>
      <div class="acciones">
        <button class="boton" data-nombre="1">🔊 Oír el nombre</button>

        <a class="boton grande" href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}" target="_blank" rel="noopener">🚗 Cómo llegar</a>
      </div></div>`;
  div.querySelector('[data-p]').onclick = () => hablar(pk, voz);
  div.querySelector('[data-nombre]').onclick = () => hablar(l.n.replace(/（.*?）|\(.*?\)/g, ''), voz);
  const img = div.querySelector('img'); if (img) img.onclick = () => verGrande(img.src);
  div.querySelector('[data-visto]').onclick = e => {
    lugaresVistos.has(i) ? lugaresVistos.delete(i) : (lugaresVistos.add(i), confeti([cat.emoji, '💮', '✨']), Voz.reaccionar(voz, 'bien'));
    guardado.escribir('lugaresVistos', [...lugaresVistos]);
    marcasLugar[i].setIcon(iconoLugar(i));
    e.currentTarget.classList.toggle('hecho', lugaresVistos.has(i)); e.currentTarget.textContent = lugaresVistos.has(i) ? '💮 Estuve' : '📍 Estuve aquí';
  };
  return div;
}
function pintarCapasLugar() {
  const n = c => LUGARES.filter(l => l.c === c).length;
  const ORDEN = ['casa', 'escuela', 'banco', 'fuji', 'onsen', 'estacion', 'templo', 'comida', 'tienda', 'puente', 'naturaleza', 'escena'];
  $('#capas-lugar').innerHTML = ORDEN.map(c => [c, CATEGORIAS_LUGAR[c]]).map(([c, d]) =>
    `<button class="capa-lugar ${capasLugar.has(c) ? 'activo' : ''}" data-capa="${c}"><span class="ico" style="background:${COLOR_LUGAR[c]}">${d.emoji}</span>
      <span>${esc(d.titulo)}<small>${n(c)} sitios</small></span></button>`).join('');
  $('#capas-lugar').querySelectorAll('[data-capa]').forEach(b => b.onclick = () => {

const filtro = { temporada: 'todas', quien: 'todas', paisaje: 'todas', estacion: 'todas', extra: 'todas', texto: '' };
const GRUPOS = [
  ['temporada', { todas: '✨ Todas', T1: '🟠 Temporada 1', T2: '🟣 Temporada 2', T3: '🔵 Temporada 3', 'Película': '🟢 Película' }],
  ['quien', { todas: '👥 Todas', ...Object.fromEntries(Object.entries(PERSONAJES).map(([k, p]) => [k, `${p.emoji} ${p.nombre}`])) }],
  ['paisaje', { todas: '🧭 Cualquier paisaje', ...PAISAJES }],
  ['estacion', { todas: '📅 Cualquier estación', ...ESTACIONES }],
  ['extra', { todas: '⭐ Todo', fuji: '🗻 Se ve el Fuji', solo: '🧍 Acampada en solitario', grupo: '👯 En grupo', comida: '🍲 Con comida del anime', visto: '💮 Ya visitados', pendiente: '🎯 Por visitar' }],
];
function pasa(c, i) {
  if (filtro.temporada !== 'todas' && c.temporada !== filtro.temporada) return false;
  if (filtro.quien !== 'todas' && !c.quien.includes(filtro.quien)) return false;
  if (filtro.paisaje !== 'todas' && !c.paisaje.includes(filtro.paisaje)) return false;
  if (filtro.estacion !== 'todas' && c.estacion !== filtro.estacion) return false;
  const e = filtro.extra;
  if (e === 'fuji' && !c.fuji) return false;
  if (e === 'solo' && c.quien.filter(q => !['sakura', 'toba'].includes(q)).length !== 1) return false;
  if (e === 'grupo' && c.quien.length < 2) return false;
  if (e === 'comida' && c.comida === '—') return false;
  if (e === 'visto' && !visitados.has(i)) return false;
  if (e === 'pendiente' && visitados.has(i)) return false;
  if (filtro.texto) {
    const t = filtro.texto.toLowerCase();
    const hay = [c.nombre, c.ja, c.kana, c.porque, c.comida, ...c.quien.map(q => PERSONAJES[q].nombre + PERSONAJES[q].ja)].join(' ').toLowerCase();
    if (!hay.includes(t)) return false;
  }
  return true;
}

/* ================= Tiempo real (Open-Meteo: gratis y sin clave) ================= */
const cacheTiempo = new Map();
async function pintarTiempo(i) {
  const c = CAMPINGS[i];
  let t = cacheTiempo.get(i);
  try {
    if (!t || Date.now() - t.hora > 30 * 60e3) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lng}&current=temperature_2m,weather_code,wind_speed_10m`
        + '&hourly=cloud_cover_low,cloud_cover_mid&daily=temperature_2m_min,temperature_2m_max,sunrise&timezone=Asia%2FTokyo&forecast_days=2';
      const r = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      t = { datos: await r.json(), hora: Date.now() }; cacheTiempo.set(i, t);
    }
  } catch (e) {
    if (seleccionado === i) $('#f-tiempo').innerHTML = '<h4>🌤️ Tiempo ahora allí · 天気</h4><p class="sub">No he podido consultar el tiempo (¿sin conexión?).</p>';
    return;
  }
  if (seleccionado !== i) return; // el usuario ya abrió otro camping
  const d = t.datos, [emo, kanji, kana, es] = tiempoDe(d.current.weather_code);
  // ¿Fuji al amanecer? Nubes bajas y medias a la hora de la salida del sol de mañana
  const amanecer = d.daily.sunrise[1], hIdx = d.hourly.time.findIndex(h => h >= amanecer.slice(0, 13) + ':00');
  const nubes = hIdx >= 0 ? Math.max(d.hourly.cloud_cover_low[hIdx], d.hourly.cloud_cover_mid[hIdx]) : null;
  const fuji = !c.fuji || nubes === null ? '' : `<div class="fuji-hoy">🗻 Mañana al amanecer (${amanecer.slice(11)}):
    ${nubes < 25 ? '<b>富士山が見える！</b> Muy probable ver el Fuji' : nubes < 60 ? '<b>見えるかも…</b> Quizá se vea el Fuji' : '<b>見えないかも</b> Difícil: muchas nubes'} · nubes ${nubes} %</div>`;
  $('#f-tiempo').innerHTML = `<h4>🌤️ Tiempo ahora allí · 天気</h4>
    <div class="tiempo"><div class="grande">${emo}</div><div class="temp">${Math.round(d.current.temperature_2m)} °C</div>
      <div style="flex:1;min-width:150px"><b class="jp" style="font-size:18px">${kanji}</b> <span class="jp sub">${kana}</span> — ${es}<br>
      <small class="sub">Esta noche ${Math.round(d.daily.temperature_2m_min[0])} °C · máx. ${Math.round(d.daily.temperature_2m_max[0])} °C · viento ${Math.round(d.current.wind_speed_10m)} km/h</small></div>
      <button class="hablar" id="f-tiempo-voz">🔊</button></div>${fuji}
    ${d.daily.temperature_2m_min[0] <= 0 ? '<div class="fuji-hoy">🥶 <b class="jp">氷点下</b> (ひょうてんか): bajo cero esta noche. Saco de invierno y カイロ.</div>' : ''}`;
  $('#f-tiempo-voz').onclick = () => hablar(`今日は${kanji}、気温は${Math.round(d.current.temperature_2m)}度です`, c.quien[0]);
}

async function reproducirEscena() {

function dibujarRuta() {
  lineaRuta.setLatLngs(ruta.map(i => [CAMPINGS[i].lat, CAMPINGS[i].lng]));
  ruta.length > 1 ? lineaRuta.addTo(mapa) : mapa.removeLayer(lineaRuta);

function alternarRuta(i) {

  k >= 0 ? ruta.splice(k, 1) : ruta.push(i);
  guardarRuta();
  avisar(k >= 0 ? `Quitado de tu ruta: ${CAMPINGS[i].nombre}` : `🧭 Añadido a tu ruta (${ruta.length} paradas)`);
}
const puntoDe = i => [CAMPINGS[i].lat, CAMPINGS[i].lng];
function largoRuta(orden, inicio) {
  let d = 0, prev = inicio;
  for (const i of orden) { if (prev) d += km(prev, puntoDe(i)); prev = puntoDe(i); }
  return d;
}
// Vecino más cercano y después 2-opt: con ≤21 paradas da una ruta muy buena al instante
function ordenarRuta() {
  if (ruta.length < 3 && !miPosicion) return;
  const quedan = [...ruta], orden = [];
  let prev = miPosicion || puntoDe(quedan[0]);
  while (quedan.length) {
    quedan.sort((a, b) => km(prev, puntoDe(a)) - km(prev, puntoDe(b)));
    const i = quedan.shift(); orden.push(i); prev = puntoDe(i);
  }
  for (let mejora = true; mejora;) {
    mejora = false;
    for (let a = 0; a < orden.length - 1; a++) for (let b = a + 1; b < orden.length; b++) {
      const prueba = [...orden.slice(0, a), ...orden.slice(a, b + 1).reverse(), ...orden.slice(b + 1)];
      if (largoRuta(prueba, miPosicion) < largoRuta(orden, miPosicion) - .01) { orden.splice(0, orden.length, ...prueba); mejora = true; }
    }
  }
  ruta.splice(0, ruta.length, ...orden); guardarRuta();
}
const PRESETS = [
  ['🛵 Viaje de Rin', () => CAMPINGS.map((c, i) => i).filter(i => CAMPINGS[i].quien.includes('rin'))],
  ['🍙 Viaje de Nadeshiko', () => CAMPINGS.map((c, i) => i).filter(i => CAMPINGS[i].quien.includes('nadeshiko'))],

  $('#mochila-sub').textContent = hechas === total ? '✅ ¡Todo listo! Rin aprobaría esta mochila' : `${hechas} de ${total} cosas · toca cada una al meterla (y oye cómo se dice)`;

  $('#mochila').innerHTML = MOCHILA.map(s => `<div class="seccion-mochila"><h3>${s.titulo} <small class="sub">· te lo dice ${PERSONAJES[s.voz].emoji} ${PERSONAJES[s.voz].nombre}</small></h3>${s.cosas.map(([w, es]) =>
    `<div class="check ${mochila.has(w) ? 'si' : ''}" data-w="${esc(w)}" data-quien="${s.voz}"><div class="caja">${mochila.has(w) ? '✓' : ''}</div>
      <div class="txt"><span class="jpn jp">${esc(w)}</span> <small>· ${esc(es)}</small></div></div>`).join('')}</div>`).join('');
  document.querySelectorAll('.check').forEach(el => el.onclick = () => {
    const w = el.dataset.w, estaba = mochila.has(w);
    estaba ? mochila.delete(w) : (mochila.add(w), hablar(w, el.dataset.quien));
    guardado.escribir('mochila', [...mochila]);

    if (!estaba && mochila.size === total) { confeti(['🎒', '⛺', '✅']); avisar('🎒 ¡Mochila completa! A la montaña'); }
  });
}

          <div style="flex:1"><b>${p.nombre}</b><span class="jp sub">${p.ja}</span></div></div>

          <button class="chip" data-hola="${k}">🔊 Oírla</button>

  $('#por-tema').onclick = () => { Voz.opcion('soloGuia', !Voz.ajustes.soloGuia); pintarPersonajes(); avisar(Voz.ajustes.soloGuia ? '⭐ Ahora la guía lee todas las palabras' : '🎭 Cada tema lo dice su personaje'); };
  $('#saludos').onclick = () => { Voz.opcion('saludos', Voz.ajustes.saludos === false); pintarPersonajes(); };

async function grabar(boton) {
  // Segundo toque: parar y guardar
  if (grabadora) return grabadora.stop();
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') return avisar('Este navegador no puede grabar audio');
  let flujo;
  try { flujo = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { return avisar('🎙️ Sin permiso para usar el micrófono'); }
  const trozos = [];
  grabadora = new MediaRecorder(flujo);
  grabadora.ondataavailable = e => trozos.push(e.data);
  grabadora.onstop = async () => {
    flujo.getTracks().forEach(t => t.stop()); grabadora = null;
    await Voz.clips.guardar(boton.dataset.grabar, new Blob(trozos, { type: trozos[0]?.type || 'audio/webm' }));
    avisar('🎙️ ¡Grabado! Ahora suena tu versión'); pintarPersonajes();
  };
  grabadora.start(); boton.classList.add('grabando'); boton.textContent = '⏹';
  avisar('🎙️ Grabando… toca ⏹ para acabar');
  setTimeout(() => grabadora?.stop(), 8000); // un clip de reacción no necesita más
}

/* ================= Hoguera: crepitar sintetizado, sin archivos de audio ================= */
const Hoguera = (() => {
  let ctx = null, nodos = [], chispas = null;
  function ruidoMarron(ctx) {
    const buf = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate), d = buf.getChannelData(0);
    let ult = 0; for (let i = 0; i < d.length; i++) { ult = (ult + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = ult * 3.5; }
    const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; return s;
  }
  function chasquido() {
    const t = ctx.currentTime, dur = .02 + Math.random() * .05;
    const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 1200 + Math.random() * 2500; g.gain.value = .15 + Math.random() * .35;
    s.buffer = buf; s.connect(f).connect(g).connect(ctx.destination); s.start(t);
  }
  return {
    get sonando() { return !!chispas; },
    encender() {
      ctx ||= new (window.AudioContext || window.webkitAudioContext)(); ctx.resume();
      const base = ruidoMarron(ctx), filtro = ctx.createBiquadFilter(), g = ctx.createGain();
      filtro.type = 'lowpass'; filtro.frequency.value = 500; g.gain.value = .5;
      base.connect(filtro).connect(g).connect(ctx.destination); base.start(); nodos = [base, g];
      const programar = () => { chasquido(); if (Math.random() < .3) setTimeout(chasquido, 40); chispas = setTimeout(programar, 80 + Math.random() * 600); };
      programar();
    },
    apagar() { clearTimeout(chispas); chispas = null; nodos.forEach(n => { try { n.stop?.(); n.disconnect(); } catch {} }); nodos = []; },
  };
})();
$('#hoguera').onclick = e => {
  Hoguera.sonando ? Hoguera.apagar() : (Hoguera.encender(), Voz.reaccionar('rin', 'hola'));
  e.currentTarget.classList.toggle('activo', Hoguera.sonando);
};

/* ================= Panel del móvil: hoja que se arrastra ================= */
const esMovil = () => matchMedia('(max-width: 820px)').matches;
(() => {
  const panel = $('#panel'), estados = ['mini', 'medio', 'lleno'];
  let estado = 'mini';
  const poner = e => { estado = e; panel.classList.remove('medio', 'lleno'); if (e !== 'mini') panel.classList.add(e); panel.style.height = ''; };
  let soltado = 0;
  // El click que llega justo después de un arrastre no debe cambiar otra vez el estado
  $('#asa').onclick = () => { if (Date.now() - soltado > 300) poner(estados[(estados.indexOf(estado) + 1) % 3]); };
  $('#ver-filtros').onclick = e => {
    const abrir = !panel.classList.contains('con-filtros');
    panel.classList.toggle('con-filtros', abrir); e.currentTarget.classList.toggle('activo', abrir);
    if (abrir && estado === 'mini') poner('medio');
  };
  $('#buscar').addEventListener('focus', () => { if (esMovil() && estado === 'mini') poner('medio'); });
  // Arrastre desde el asa o la cabecera (no desde el buscador ni los botones)
  let inicioY = null, altoInicio = 0, movido = false;
  panel.addEventListener('pointerdown', e => {
    if (!esMovil() || !e.target.closest('.asa, #panel header') || e.target.closest('input, #ver-filtros')) return;
    inicioY = e.clientY; altoInicio = panel.getBoundingClientRect().height; movido = false;
  });
  addEventListener('pointermove', e => {
    if (inicioY === null) return;
    const dy = inicioY - e.clientY;
    if (Math.abs(dy) > 6) { movido = true; panel.classList.add('arrastrando'); }
    if (movido) panel.style.height = Math.max(150, Math.min(innerHeight - 90, altoInicio + dy)) + 'px';
  });
  addEventListener('pointerup', () => {
    if (inicioY === null) return;
    inicioY = null; panel.classList.remove('arrastrando');
    if (!movido) return;
    const h = panel.getBoundingClientRect().height / innerHeight;
    poner(h < .36 ? 'mini' : h < .7 ? 'medio' : 'lleno');
    soltado = Date.now();
  });
  window.panelMovil = { poner };
})();

  pararEscena();
  document.querySelectorAll('#dock button').forEach(b => b.classList.toggle('activo', b.dataset.vista === vista));
  document.querySelectorAll('.hoja').forEach(h => h.classList.toggle('abierta', h.id === 'hoja-' + vista));
  const enMapa = vista === 'mapa';

  $('#herramientas').style.opacity = enMapa ? 1 : 0; $('#herramientas').style.pointerEvents = enMapa ? '' : 'none';
  if (!enMapa) { $('#ficha').classList.remove('abierta'); document.body.classList.remove('ficha-abierta'); abrirCapas(false); mapa.closePopup(); }
  if (vista === 'palabras') pintarPalabras();
  if (vista === 'quiz') pintarMenuQuiz();
  if (vista === 'mochila') pintarMochila();
  if (vista === 'pasaporte') pintarPasaporte();

}
document.querySelectorAll('#dock button').forEach(b => b.onclick = () => irA(b.dataset.vista));
